{% extends "doobarashop/layout.html" %}
{% load static %}

{% block pagetitle %}
VIDEO
{% endblock %}

{% block body %}
    <section class="video-page" aria-label="Video gallery">
        <div id="video-carousel-container">
            {% for v in video %}
                <article class="video-card">
                    <div class="youtube-video">
                        <iframe width="560" height="315" src="{{ v.video_url}}" title="{{ v.title }}" 
                        frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
                    </iframe>

                    </div>
                    <div class="video-card__content">
                        <h3 class="video-card__title">{{ v.title }}</h3>
                        <p class="video-card__description">
                            {{ v.description }}
                        </p>
                    </div>
                </article>
            {% endfor %}
        </div>
    </section>
{% endblock %}
